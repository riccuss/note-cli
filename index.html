<body>
  <h1>note-cli</h1>
  <p class="tagline">Ein kleines Kommandozeilentool für Notizen.</p>

  <p>
    Jede Notiz ist einfach nur ihr Inhalt: gespeichert unter einem Dateinamen,
    der der SHA-256-Hash dieses Inhalts ist. Kein Titel, keine Endung.
  </p>

  <pre><code>note add "Meine erste Notiz"
note list
note delete &lt;hash&gt;</code></pre>

  <p>
    Quellcode auf <a href="https://github.com/">GitHub</a>.
  </p>
